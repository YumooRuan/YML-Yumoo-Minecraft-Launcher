name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Compile
        shell: pwsh
        run: .\build.ps1

      - name: Package jar build
        shell: pwsh
        run: .\package.ps1

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: YML-jar
          path: dist/YML/
          if-no-files-found: error
