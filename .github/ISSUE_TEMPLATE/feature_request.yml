name: Feature request
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      placeholder: 现在使用时会遇到...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可替代方案
  - type: input
    id: versions
    attributes:
      label: 相关 Minecraft / 加载器版本
      placeholder: "1.20.1 Forge"
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，没有重复建议
          required: true
